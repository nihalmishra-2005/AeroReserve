# ===========================
# APPLICATION CONFIG
# ===========================
spring.application.name=Airline Reservation System
server.port=8080

# ===========================
# MYSQL DATABASE CONFIG
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/airline_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / HIBERNATE CONFIG
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# THYMELEAF CONFIG
# ===========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===========================
# LOGGING
# ===========================
logging.level.com.airline=DEBUG
logging.level.org.springframework.security=INFO
