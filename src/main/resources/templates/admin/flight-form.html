<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Flight Form | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-logo"><i class="bi bi-airplane-fill"></i><span>AirReserve<br/><small>Admin</small></span></div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
            <a href="/admin/flights" class="sidebar-link active"><i class="bi bi-airplane-fill"></i>Flights</a>
            <a href="/admin/bookings" class="sidebar-link"><i class="bi bi-ticket-perforated-fill"></i>Bookings</a>
            <a href="/admin/users" class="sidebar-link"><i class="bi bi-people-fill"></i>Users</a>
        </nav>
    </aside>
    <main class="admin-main">
        <div class="admin-topbar">
            <div>
                <h2 class="admin-page-title" th:text="${flight.id != null ? 'Edit Flight' : 'Add New Flight'}">Add Flight</h2>
            </div>
            <a href="/admin/flights" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
        </div>

        <div class="section-card">
            <div class="section-card-body">
                <form th:action="@{/admin/flights/save}" method="post" th:object="${flight}">
                    <input type="hidden" th:field="*{id}"/>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Flight Number *</label>
                            <input type="text" class="form-control ar-input" th:field="*{flightNumber}" placeholder="e.g. AR101" required/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Airline Name *</label>
                            <input type="text" class="form-control ar-input" th:field="*{airlineName}" placeholder="e.g. AirReserve" required/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Base Price (₹) *</label>
                            <input type="number" class="form-control ar-input" th:field="*{basePrice}" step="0.01" min="0" required/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">From City *</label>
                            <input type="text" class="form-control ar-input" th:field="*{sourceCity}" placeholder="New Delhi" required/>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold">From Code *</label>
                            <input type="text" class="form-control ar-input" th:field="*{sourceCode}" placeholder="DEL" maxlength="5" required/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">To City *</label>
                            <input type="text" class="form-control ar-input" th:field="*{destinationCity}" placeholder="Mumbai" required/>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold">To Code *</label>
                            <input type="text" class="form-control ar-input" th:field="*{destinationCode}" placeholder="BOM" maxlength="5" required/>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold">Duration (mins) *</label>
                            <input type="number" class="form-control ar-input" th:field="*{durationMinutes}" min="30" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Departure Time *</label>
                            <input type="datetime-local" class="form-control ar-input" th:field="*{departureTime}" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Arrival Time *</label>
                            <input type="datetime-local" class="form-control ar-input" th:field="*{arrivalTime}" required/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Economy Seats</label>
                            <input type="number" class="form-control ar-input" th:field="*{totalEconomySeats}" min="0"/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Business Seats</label>
                            <input type="number" class="form-control ar-input" th:field="*{totalBusinessSeats}" min="0"/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">First Class Seats</label>
                            <input type="number" class="form-control ar-input" th:field="*{totalFirstSeats}" min="0"/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Status</label>
                            <select class="form-select ar-input" th:field="*{status}">
                                <option value="SCHEDULED">Scheduled</option>
                                <option value="DELAYED">Delayed</option>
                                <option value="CANCELLED">Cancelled</option>
                                <option value="COMPLETED">Completed</option>
                            </select>
                        </div>
                    </div>
                    <hr class="my-4"/>
                    <button type="submit" class="btn btn-ar-primary me-2">
                        <i class="bi bi-check-lg me-2"></i>Save Flight
                    </button>
                    <a href="/admin/flights" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
