<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Manage Flights | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-logo"><i class="bi bi-airplane-fill"></i><span>AirReserve<br/><small>Admin</small></span></div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
            <a href="/admin/flights" class="sidebar-link active"><i class="bi bi-airplane-fill"></i>Flights</a>
            <a href="/admin/bookings" class="sidebar-link"><i class="bi bi-ticket-perforated-fill"></i>Bookings</a>
            <a href="/admin/users" class="sidebar-link"><i class="bi bi-people-fill"></i>Users</a>
            <hr class="sidebar-divider"/>
            <a href="/dashboard" class="sidebar-link"><i class="bi bi-house-fill"></i>User View</a>
            <form th:action="@{/auth/logout}" method="post"><button type="submit" class="sidebar-link sidebar-logout"><i class="bi bi-box-arrow-right"></i>Logout</button></form>
        </nav>
    </aside>
    <main class="admin-main">
        <div class="admin-topbar">
            <div><h2 class="admin-page-title">Manage Flights</h2><p class="admin-page-sub" th:text="${flights.size() + ' flights in system'}"></p></div>
            <a href="/admin/flights/new" class="btn btn-ar-primary"><i class="bi bi-plus-lg me-1"></i>Add New Flight</a>
        </div>

        <div th:if="${success}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span></div>
        <div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span></div>

        <div class="section-card">
            <div class="section-card-body">
                <div class="table-responsive">
                    <table class="table ar-table">
                        <thead>
                            <tr><th>Flight #</th><th>Airline</th><th>Route</th><th>Departure</th><th>Arrival</th><th>Duration</th><th>Base Price</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="f : ${flights}">
                                <td><strong th:text="${f.flightNumber}"></strong></td>
                                <td th:text="${f.airlineName}"></td>
                                <td>
                                    <span class="route-mini">
                                        <span th:text="${f.sourceCode}"></span><i class="bi bi-arrow-right"></i><span th:text="${f.destinationCode}"></span>
                                    </span>
                                    <br/><small class="text-muted" th:text="${f.sourceCity + ' → ' + f.destinationCity}"></small>
                                </td>
                                <td th:text="${#temporals.format(f.departureTime,'dd MMM · HH:mm')}"></td>
                                <td th:text="${#temporals.format(f.arrivalTime,'dd MMM · HH:mm')}"></td>
                                <td th:text="${f.durationFormatted}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(f.basePrice,1,0)}"></td>
                                <td><span class="status-badge" th:classappend="${f.status.name()=='SCHEDULED'?'status-confirmed':(f.status.name()=='CANCELLED'?'status-cancelled':'status-pending')}" th:text="${f.status}"></span></td>
                                <td>
                                    <a th:href="@{/admin/flights/{id}/edit(id=${f.id})}" class="btn btn-xs btn-outline-primary me-1"><i class="bi bi-pencil me-1"></i>Edit</a>
                                    <a th:href="@{/admin/flights/{id}/seats(id=${f.id})}" class="btn btn-xs btn-outline-secondary me-1"><i class="bi bi-grid me-1"></i>Seats</a>
                                    <form th:action="@{/admin/flights/{id}/delete(id=${f.id})}" method="post" class="d-inline">
                                        <button class="btn btn-xs btn-outline-danger" onclick="return confirm('Delete this flight? All associated data will be removed.')"><i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
