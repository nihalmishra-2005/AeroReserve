<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body style="background:linear-gradient(135deg,#060b1e 0%,#0a0f2c 100%);min-height:100vh;">

<div class="d-flex align-items-center justify-content-center min-vh-100 p-3 py-5">
  <div style="width:100%;max-width:500px;">

    <div class="text-center mb-4">
      <a href="/" class="text-decoration-none d-inline-flex align-items-center gap-2">
        <div class="brand-icon" style="width:44px;height:44px;font-size:1.4rem;">✈</div>
        <span style="font-family:'Orbitron',sans-serif;font-size:1.5rem;color:#00d4ff;font-weight:700;">SkyWings</span>
      </a>
    </div>

    <div class="auth-card">
      <h4 class="text-center mb-1 fw-bold">Create Account</h4>
      <p class="text-center text-muted small mb-4">Join SkyWings and start your journey</p>

      <div th:if="${errorMessage}" class="alert alert-dark-danger mb-3">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}"></span>
      </div>

      <form th:action="@{/auth/register}" method="post" th:object="${user}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label-dark">FIRST NAME</label>
            <input type="text" th:field="*{firstName}" class="form-control form-control-dark"
                   placeholder="John" required/>
            <div th:if="${#fields.hasErrors('firstName')}" class="text-danger small mt-1"
                 th:errors="*{firstName}"></div>
          </div>
          <div class="col-6">
            <label class="form-label-dark">LAST NAME</label>
            <input type="text" th:field="*{lastName}" class="form-control form-control-dark"
                   placeholder="Doe" required/>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label-dark">EMAIL ADDRESS</label>
          <input type="email" th:field="*{email}" class="form-control form-control-dark"
                 placeholder="your@email.com" required/>
          <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1"
               th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label-dark">PHONE NUMBER</label>
          <input type="tel" th:field="*{phone}" class="form-control form-control-dark"
                 placeholder="+91 98765 43210"/>
        </div>

        <div class="mb-3">
          <label class="form-label-dark">PASSWORD</label>
          <input type="password" th:field="*{password}" class="form-control form-control-dark"
                 placeholder="Min 6 characters" required minlength="6"/>
        </div>

        <div class="mb-4">
          <label class="form-label-dark">CONFIRM PASSWORD</label>
          <input type="password" name="confirmPassword" class="form-control form-control-dark"
                 placeholder="Repeat your password" required/>
        </div>

        <button type="submit" class="btn btn-accent w-100 py-3 mb-3">
          <i class="bi bi-person-plus me-2"></i>Create Account
        </button>
      </form>

      <div class="text-center">
        <span class="text-muted small">Already have an account? </span>
        <a href="/auth/login" style="color:#00d4ff;" class="text-decoration-none fw-600">Sign In</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
