<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up | AirReserve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body class="auth-body">
<div class="auth-split">
    <div class="auth-visual auth-visual-signup">
        <div class="auth-visual-content">
            <div class="auth-logo">
                <i class="bi bi-airplane-fill"></i>
                <span>Air<strong>Reserve</strong></span>
            </div>
            <h1 class="auth-headline">Your Journey<br/>Starts<br/><span class="text-accent">Today</span></h1>
            <p class="auth-subtext">Join millions of travelers booking with confidence through AirReserve.</p>
            <ul class="auth-perks">
                <li><i class="bi bi-check-circle-fill"></i> Instant seat selection</li>
                <li><i class="bi bi-check-circle-fill"></i> Best price guarantee</li>
                <li><i class="bi bi-check-circle-fill"></i> 24/7 customer support</li>
                <li><i class="bi bi-check-circle-fill"></i> Easy cancellations</li>
            </ul>
        </div>
    </div>
    <div class="auth-form-panel">
        <div class="auth-form-wrapper">
            <h2 class="form-title">Create Account</h2>
            <p class="form-subtitle">Start your AirReserve journey</p>

            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

            <form th:action="@{/auth/signup}" method="post" th:object="${user}">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control ar-input" id="fullName" th:field="*{fullName}"
                           placeholder="Full Name" required/>
                    <label for="fullName"><i class="bi bi-person me-1"></i> Full Name</label>
                    <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control ar-input" id="email" th:field="*{email}"
                           placeholder="Email" required/>
                    <label for="email"><i class="bi bi-envelope me-1"></i> Email Address</label>
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="form-floating mb-3">
                    <input type="tel" class="form-control ar-input" id="phone" th:field="*{phone}"
                           placeholder="Phone"/>
                    <label for="phone"><i class="bi bi-phone me-1"></i> Phone (Optional)</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control ar-input" id="password" th:field="*{password}"
                           placeholder="Password" required minlength="6"/>
                    <label for="password"><i class="bi bi-lock me-1"></i> Password (min 6 chars)</label>
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-ar-primary w-100 mb-3">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
                <p class="text-center auth-switch">
                    Already have an account? <a href="/auth/login">Sign in</a>
                </p>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
