<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>My Bookings | AirReserve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg ar-navbar">
    <div class="container">
        <a class="navbar-brand" href="/dashboard"><span class="brand-icon"><i class="bi bi-airplane-fill"></i></span><span class="brand-text">Air<span class="brand-accent">Reserve</span></span></a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/flights/search">Search Flights</a></li>
                <li class="nav-item"><a class="nav-link active" href="/bookings/history">My Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                <li class="nav-item"><form th:action="@{/auth/logout}" method="post" class="d-inline"><button type="submit" class="btn btn-outline-light btn-sm ms-2"><i class="bi bi-box-arrow-right"></i></button></form></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="page-header mb-4">
        <h2 class="page-title"><i class="bi bi-ticket-perforated me-2"></i>My Bookings</h2>
        <p class="page-subtitle">Your complete travel history with AirReserve</p>
    </div>

    <div th:if="${param.cancelled}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Booking cancelled successfully.</div>

    <div th:if="${bookings == null or bookings.empty}" class="empty-state">
        <i class="bi bi-airplane"></i>
        <p>No bookings yet. Ready to fly?</p>
        <a href="/flights/search" class="btn btn-ar-primary">Search Flights</a>
    </div>

    <div th:unless="${bookings == null or bookings.empty}" class="booking-history-list">
        <div class="booking-history-item" th:each="b : ${bookings}"
             th:classappend="${b.status.name() == 'CANCELLED' ? ' bhi-cancelled' : ''}">
            <div class="bhi-route">
                <span class="bhi-code" th:text="${b.flight.sourceCode}">DEL</span>
                <div class="bhi-arrow"><i class="bi bi-airplane-fill"></i></div>
                <span class="bhi-code" th:text="${b.flight.destinationCode}">BOM</span>
            </div>
            <div class="bhi-details">
                <div class="bhi-main">
                    <span class="bhi-cities" th:text="${b.flight.sourceCity + ' → ' + b.flight.destinationCity}"></span>
                    <span class="status-badge ms-2"
                          th:classappend="${b.status.name() == 'CONFIRMED' ? 'status-confirmed' : 'status-cancelled'}"
                          th:text="${b.status}"></span>
                </div>
                <div class="bhi-meta">
                    <span><i class="bi bi-calendar3 me-1"></i><span th:text="${#temporals.format(b.flight.departureTime,'dd MMM yyyy · HH:mm')}"></span></span>
                    <span><i class="bi bi-airplane me-1"></i><span th:text="${b.flight.flightNumber}"></span></span>
                    <span><i class="bi bi-grid me-1"></i>Seat <span th:text="${b.seat.seatNumber}"></span></span>
                    <span><span class="class-badge" th:classappend="${'class-'+b.classType}" th:text="${b.classType}"></span></span>
                </div>
            </div>
            <div class="bhi-ref">
                <div class="bhi-ref-num" th:text="${b.bookingRef}">AR12345</div>
                <div class="bhi-amount" th:text="'₹' + ${#numbers.formatDecimal(b.amountPaid,1,0)}"></div>
            </div>
            <div class="bhi-actions" th:if="${b.status.name() == 'CONFIRMED'}">
                <form th:action="@{/bookings/{id}/cancel(id=${b.id})}" method="post"
                      onsubmit="return confirm('Cancel this booking?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </button>
                </form>
            </div>
            <div class="bhi-actions" th:if="${b.status.name() == 'CANCELLED'}">
                <span class="text-muted small">Cancelled <span th:if="${b.cancelledAt}" th:text="${#temporals.format(b.cancelledAt,'dd MMM')}"></span></span>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
