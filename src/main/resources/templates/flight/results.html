<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Flight Results | AirReserve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg ar-navbar">
    <div class="container">
        <a class="navbar-brand" href="/dashboard"><span class="brand-icon"><i class="bi bi-airplane-fill"></i></span><span class="brand-text">Air<span class="brand-accent">Reserve</span></span></a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/flights/search"><i class="bi bi-search me-1"></i>New Search</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings/history"><i class="bi bi-ticket-perforated me-1"></i>My Bookings</a></li>
                <li class="nav-item"><form th:action="@{/auth/logout}" method="post" class="d-inline"><button type="submit" class="btn btn-outline-light btn-sm ms-2"><i class="bi bi-box-arrow-right"></i></button></form></li>
            </ul>
        </div>
    </div>
</nav>

<div class="results-header">
    <div class="container">
        <div class="results-route-display">
            <span class="results-city" th:text="${from}">New Delhi</span>
            <div class="results-route-line">
                <span class="route-dot"></span>
                <div class="route-line-bar"><i class="bi bi-airplane-fill flying-plane"></i></div>
                <span class="route-dot"></span>
            </div>
            <span class="results-city" th:text="${to}">Mumbai</span>
        </div>
        <p class="results-meta">
            <i class="bi bi-calendar3 me-1"></i>
            <span th:text="${date}"></span>
            &nbsp;·&nbsp;
            <strong th:text="${flights?.size() ?: 0}">0</strong> flights found
        </p>
    </div>
</div>

<div class="container py-4">
    <!-- RE-SEARCH BAR -->
    <div class="mini-search-bar mb-4">
        <form th:action="@{/flights/search}" method="post" class="row g-2 align-items-end">
            <div class="col-md-4"><input type="text" name="from" class="form-control search-input-sm" th:value="${from}" placeholder="From" required/></div>
            <div class="col-md-4"><input type="text" name="to" class="form-control search-input-sm" th:value="${to}" placeholder="To" required/></div>
            <div class="col-md-3"><input type="date" name="date" class="form-control search-input-sm" th:value="${date}" required/></div>
            <div class="col-md-1"><button type="submit" class="btn btn-ar-primary w-100"><i class="bi bi-search"></i></button></div>
        </form>
    </div>

    <!-- NO RESULTS -->
    <div th:if="${flights == null or flights.empty}" class="empty-state-lg">
        <i class="bi bi-airplane text-muted" style="font-size:5rem;"></i>
        <h3 class="mt-3">No flights found</h3>
        <p class="text-muted">Try adjusting your search criteria or choose a different date.</p>
        <a href="/flights/search" class="btn btn-ar-primary mt-2">Search Again</a>
    </div>

    <!-- FLIGHT RESULTS LIST -->
    <div th:unless="${flights == null or flights.empty}">
        <div class="flight-result-card" th:each="f : ${flights}">
            <div class="flight-result-main">
                <!-- AIRLINE INFO -->
                <div class="frc-airline">
                    <div class="airline-logo-mini"><i class="bi bi-airplane-fill"></i></div>
                    <div>
                        <div class="airline-name" th:text="${f.airlineName}">AirReserve</div>
                        <div class="flight-num" th:text="${f.flightNumber}">AR101</div>
                    </div>
                </div>

                <!-- ROUTE DISPLAY (VISUAL) -->
                <div class="frc-route">
                    <div class="frc-time-block">
                        <div class="frc-time" th:text="${#temporals.format(f.departureTime, 'HH:mm')}">10:00</div>
                        <div class="frc-city" th:text="${f.sourceCode}">DEL</div>
                        <div class="frc-cityname" th:text="${f.sourceCity}">New Delhi</div>
                    </div>
                    <div class="frc-path">
                        <div class="frc-duration" th:text="${f.durationFormatted}">2h 5m</div>
                        <div class="frc-path-line">
                            <span class="path-dot"></span>
                            <div class="path-bar"><i class="bi bi-airplane-fill frc-plane-icon"></i></div>
                            <span class="path-dot"></span>
                        </div>
                        <div class="frc-nonstop">Non-stop</div>
                    </div>
                    <div class="frc-time-block text-end">
                        <div class="frc-time" th:text="${#temporals.format(f.arrivalTime, 'HH:mm')}">12:05</div>
                        <div class="frc-city" th:text="${f.destinationCode}">BOM</div>
                        <div class="frc-cityname" th:text="${f.destinationCity}">Mumbai</div>
                    </div>
                </div>

                <!-- PRICE & CLASS SELECTOR -->
                <div class="frc-pricing">
                    <div class="price-tabs" th:attr="data-flight-id=${f.id}">
                        <div class="price-tab price-tab-active" data-class="Economy">
                            <span class="pt-class">Economy</span>
                            <span class="pt-price" th:text="'₹' + ${#numbers.formatDecimal(f.basePrice, 1, 0)}"></span>
                        </div>
                        <div class="price-tab" data-class="Business">
                            <span class="pt-class">Business</span>
                            <span class="pt-price" th:text="'₹' + ${#numbers.formatDecimal(f.basePrice.multiply(1.75), 1, 0)}"></span>
                        </div>
                        <div class="price-tab" data-class="First">
                            <span class="pt-class">First</span>
                            <span class="pt-price" th:text="'₹' + ${#numbers.formatDecimal(f.basePrice.multiply(2.8), 1, 0)}"></span>
                        </div>
                    </div>
                    <a class="btn btn-ar-primary btn-book mt-3"
                       th:href="@{/flights/{id}/seats(id=${f.id}, classType='Economy')}"
                       th:attr="data-flight-id=${f.id}">
                        Select Seats <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('.price-tab').forEach(tab => {
    tab.addEventListener('click', function() {
        const container = this.closest('.price-tabs');
        container.querySelectorAll('.price-tab').forEach(t => t.classList.remove('price-tab-active'));
        this.classList.add('price-tab-active');
        const flightId = container.dataset.flightId;
        const cls = this.dataset.class;
        const bookBtn = document.querySelector(`.btn-book[data-flight-id="${flightId}"]`);
        bookBtn.href = `/flights/${flightId}/seats?classType=${cls}`;
    });
});
</script>
</body>
</html>
