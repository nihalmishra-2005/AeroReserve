<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>All Bookings | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-logo"><i class="bi bi-airplane-fill"></i><span>AirReserve<br/><small>Admin</small></span></div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
            <a href="/admin/flights" class="sidebar-link"><i class="bi bi-airplane-fill"></i>Flights</a>
            <a href="/admin/bookings" class="sidebar-link active"><i class="bi bi-ticket-perforated-fill"></i>Bookings</a>
            <a href="/admin/users" class="sidebar-link"><i class="bi bi-people-fill"></i>Users</a>
            <hr class="sidebar-divider"/>
            <a href="/dashboard" class="sidebar-link"><i class="bi bi-house-fill"></i>User View</a>
            <form th:action="@{/auth/logout}" method="post"><button type="submit" class="sidebar-link sidebar-logout"><i class="bi bi-box-arrow-right"></i>Logout</button></form>
        </nav>
    </aside>
    <main class="admin-main">
        <div class="admin-topbar">
            <div><h2 class="admin-page-title">All Bookings</h2><p class="admin-page-sub" th:text="${bookings.size() + ' total bookings'}"></p></div>
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div class="section-card">
            <div class="section-card-body">
                <div class="table-responsive">
                    <table class="table ar-table">
                        <thead><tr><th>Ref</th><th>Passenger</th><th>Email</th><th>Flight</th><th>Route</th><th>Seat</th><th>Class</th><th>Amount</th><th>Booked</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            <tr th:each="b : ${bookings}">
                                <td><span class="booking-ref" th:text="${b.bookingRef}"></span></td>
                                <td th:text="${b.passengerName}"></td>
                                <td th:text="${b.passengerEmail}"></td>
                                <td th:text="${b.flight.flightNumber}"></td>
                                <td><span class="route-mini"><span th:text="${b.flight.sourceCode}"></span><i class="bi bi-arrow-right"></i><span th:text="${b.flight.destinationCode}"></span></span></td>
                                <td th:text="${b.seat.seatNumber}"></td>
                                <td><span class="class-badge" th:classappend="${'class-'+b.classType}" th:text="${b.classType}"></span></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(b.amountPaid,1,0)}"></td>
                                <td th:text="${#temporals.format(b.bookedAt,'dd MMM')}"></td>
                                <td><span class="status-badge" th:classappend="${b.status.name()=='CONFIRMED'?'status-confirmed':'status-cancelled'}" th:text="${b.status}"></span></td>
                                <td>
                                    <form th:action="@{/admin/bookings/{id}/cancel(id=${b.id})}" method="post" class="d-inline" th:if="${b.status.name()=='CONFIRMED'}">
                                        <button class="btn btn-xs btn-outline-danger" onclick="return confirm('Cancel?')"><i class="bi bi-x"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
