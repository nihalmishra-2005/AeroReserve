<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Users | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-logo"><i class="bi bi-airplane-fill"></i><span>AirReserve<br/><small>Admin</small></span></div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
            <a href="/admin/flights" class="sidebar-link"><i class="bi bi-airplane-fill"></i>Flights</a>
            <a href="/admin/bookings" class="sidebar-link"><i class="bi bi-ticket-perforated-fill"></i>Bookings</a>
            <a href="/admin/users" class="sidebar-link active"><i class="bi bi-people-fill"></i>Users</a>
            <hr class="sidebar-divider"/>
            <a href="/dashboard" class="sidebar-link"><i class="bi bi-house-fill"></i>User View</a>
            <form th:action="@{/auth/logout}" method="post"><button type="submit" class="sidebar-link sidebar-logout"><i class="bi bi-box-arrow-right"></i>Logout</button></form>
        </nav>
    </aside>
    <main class="admin-main">
        <div class="admin-topbar">
            <div><h2 class="admin-page-title">Registered Users</h2><p class="admin-page-sub" th:text="${users.size() + ' users registered'}"></p></div>
        </div>
        <div class="section-card">
            <div class="section-card-body">
                <div class="table-responsive">
                    <table class="table ar-table">
                        <thead><tr><th>ID</th><th>Full Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Joined</th><th>Active</th></tr></thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td th:text="${u.id}"></td>
                                <td><strong th:text="${u.fullName}"></strong></td>
                                <td th:text="${u.email}"></td>
                                <td th:text="${u.phone ?: '-'}"></td>
                                <td><span class="role-badge" th:classappend="${u.role.name()=='ADMIN'?'role-admin':'role-user'}" th:text="${u.role}"></span></td>
                                <td th:text="${#temporals.format(u.createdAt,'dd MMM yyyy')}"></td>
                                <td><span th:text="${u.isActive?'Active':'Inactive'}" th:classappend="${u.isActive?'text-success':'text-danger'}" class="fw-semibold"></span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
