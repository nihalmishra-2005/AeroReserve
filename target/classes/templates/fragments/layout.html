<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===== NAVBAR FRAGMENT ===== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(135deg, #0a0f2c 0%, #1a1f4e 100%); border-bottom: 2px solid #00d4ff20;">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <div class="brand-icon">✈</div>
      <span class="brand-text">Sky<span style="color:#00d4ff;">Wings</span></span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-4">
        <li class="nav-item">
          <a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/flights/search"><i class="bi bi-search me-1"></i>Search Flights</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" href="/bookings/history"><i class="bi bi-ticket-perforated me-1"></i>My Bookings</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link text-warning" href="/admin/dashboard"><i class="bi bi-shield-check me-1"></i>Admin Panel</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3" sec:authorize="!isAuthenticated()">
        <a href="/auth/login" class="btn btn-outline-light btn-sm px-4">Login</a>
        <a href="/auth/register" class="btn btn-primary btn-sm px-4" style="background:#00d4ff;border:none;color:#000;font-weight:700;">Sign Up</a>
      </div>
      <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
        <div class="user-avatar">
          <i class="bi bi-person-circle fs-5 text-light"></i>
          <span class="ms-2 text-light small" sec:authentication="name">User</span>
        </div>
        <a href="/auth/logout" class="btn btn-outline-danger btn-sm px-3">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- ===== HEAD META FRAGMENT ===== -->
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} + ' | SkyWings Airlines'">SkyWings Airlines</title>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>

<!-- ===== FOOTER FRAGMENT ===== -->
<footer th:fragment="footer" class="footer mt-auto py-4" style="background:#0a0f2c;border-top:1px solid #ffffff10;">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-4">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span style="font-size:1.5rem;">✈</span>
          <span class="fw-bold" style="color:#00d4ff;font-family:'Orbitron',sans-serif;">SkyWings</span>
        </div>
        <small class="text-muted">Your trusted travel partner</small>
      </div>
      <div class="col-md-4 text-center">
        <small class="text-muted">© 2024 SkyWings Airlines. All rights reserved.</small>
      </div>
      <div class="col-md-4 text-end">
        <small class="text-muted">Built with Spring Boot + Thymeleaf</small>
      </div>
    </div>
  </div>
</footer>

</html>
