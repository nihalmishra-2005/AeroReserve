<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Booking Confirmed')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <!-- Success Banner -->
      <div class="text-center mb-5">
        <div style="width:80px;height:80px;background:rgba(0,230,118,0.15);border:2px solid #00e676;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2rem;">✓</div>
        <h2 class="fw-bold">Booking <span style="color:#00e676;">Confirmed!</span></h2>
        <p class="text-muted">Your flight has been booked successfully. Have a great journey!</p>
      </div>

      <!-- E-Ticket Card -->
      <div style="background:linear-gradient(135deg,#111827,#1a1f4e);border:1px solid rgba(0,212,255,0.2);border-radius:24px;overflow:hidden;">

        <!-- Top colored bar -->
        <div style="height:6px;background:linear-gradient(90deg,#00d4ff,#0070ff,#00d4ff);background-size:200%;animation:shimmer 2s linear infinite;"></div>

        <!-- Header -->
        <div class="p-4 d-flex justify-content-between align-items-start"
             style="border-bottom:1px dashed rgba(255,255,255,0.1);">
          <div>
            <div style="font-family:'Orbitron',sans-serif;color:#00d4ff;font-size:0.8rem;letter-spacing:2px;">E-TICKET</div>
            <div style="font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:700;"
                 th:text="${booking.bookingReference}">SW12345678</div>
          </div>
          <div class="text-end">
            <span class="badge px-3 py-2 rounded-pill badge-confirmed"
                  th:text="${booking.bookingStatus}">CONFIRMED</span>
          </div>
        </div>

        <!-- Route -->
        <div class="p-4">
          <div class="route-visual mb-4">
            <div class="route-city">
              <div class="code" th:text="${booking.flight.sourceAirportCode}">DEL</div>
              <div class="name" th:text="${booking.flight.sourceCity}">Delhi</div>
              <div class="text-muted small fw-bold"
                   th:text="${#temporals.format(booking.flight.departureTime, 'HH:mm')}"></div>
            </div>
            <div class="route-line">
              <span class="route-plane">✈</span>
            </div>
            <div class="route-city">
              <div class="code" th:text="${booking.flight.destinationAirportCode}">BOM</div>
              <div class="name" th:text="${booking.flight.destinationCity}">Mumbai</div>
              <div class="text-muted small fw-bold"
                   th:text="${#temporals.format(booking.flight.arrivalTime, 'HH:mm')}"></div>
            </div>
          </div>

          <!-- Details Grid -->
          <div class="row g-3">
            <div class="col-6 col-md-3">
              <div class="p-3 rounded-3" style="background:rgba(255,255,255,0.04);">
                <div class="form-label-dark mb-1">PASSENGER</div>
                <div class="fw-bold small" th:text="${booking.passengerFullName}"></div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 rounded-3" style="background:rgba(255,255,255,0.04);">
                <div class="form-label-dark mb-1">FLIGHT</div>
                <div class="fw-bold small" th:text="${booking.flight.flightNumber}"></div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 rounded-3" style="background:rgba(255,255,255,0.04);">
                <div class="form-label-dark mb-1">DATE</div>
                <div class="fw-bold small"
                     th:text="${#temporals.format(booking.flight.departureTime, 'dd MMM yyyy')}"></div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 rounded-3" style="background:rgba(255,255,255,0.04);">
                <div class="form-label-dark mb-1">SEAT</div>
                <div class="fw-bold small"
                     th:text="${booking.seat != null ? booking.seat.seatNumber : 'N/A'}">5A</div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 rounded-3" style="background:rgba(255,255,255,0.04);">
                <div class="form-label-dark mb-1">CLASS</div>
                <div class="fw-bold small"
                     th:class="'fw-bold small class-' + ${booking.classType.name().toLowerCase()}"
                     th:text="${booking.classType}"></div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 rounded-3" style="background:rgba(255,255,255,0.04);">
                <div class="form-label-dark mb-1">AIRCRAFT</div>
                <div class="fw-bold small" th:text="${booking.flight.aircraftType}"></div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 rounded-3" style="background:rgba(255,255,255,0.04);">
                <div class="form-label-dark mb-1">DURATION</div>
                <div class="fw-bold small" th:text="${booking.flight.formattedDuration}"></div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 rounded-3" style="background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.2);">
                <div class="form-label-dark mb-1">TOTAL PAID</div>
                <div class="price-tag fw-bold"
                     th:text="'₹' + ${#numbers.formatDecimal(booking.totalAmount, 0, 0)}"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Barcode-style footer -->
        <div class="p-4 text-center" style="border-top:1px dashed rgba(255,255,255,0.1);">
          <div class="text-muted small mb-2">BARCODE</div>
          <div style="letter-spacing:3px;font-family:monospace;color:#00d4ff;font-size:0.9rem;word-break:break-all;"
               th:text="${booking.bookingReference}"></div>
          <div class="d-flex justify-content-center gap-1 mt-2" id="barcode">
            <!-- Simulated barcode bars -->
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex gap-3 mt-4">
        <a href="/bookings/history" class="btn btn-outline-light flex-fill py-3">
          <i class="bi bi-ticket-perforated me-2"></i>My Bookings
        </a>
        <a href="/flights/search" class="btn btn-accent flex-fill py-3">
          <i class="bi bi-search me-2"></i>Book Another
        </a>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Generate simulated barcode
const bc = document.getElementById('barcode');
for (let i = 0; i < 60; i++) {
  const bar = document.createElement('div');
  bar.style.cssText = `width:${Math.random() > 0.5 ? '3px' : '1px'};height:40px;background:#00d4ff;opacity:${0.4+Math.random()*0.6}`;
  bc.appendChild(bar);
}

// Add shimmer keyframes dynamically
const style = document.createElement('style');
style.textContent = '@keyframes shimmer { 0% { background-position: 0% } 100% { background-position: 200% } }';
document.head.appendChild(style);
</script>
</body>
</html>
